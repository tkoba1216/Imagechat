<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルタイムチャット</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Socket.io のセットアップ
            const socket = io();

            const messageInput = document.getElementById("message-input");
            const messageButton = document.getElementById("send-message");
            const messagesList = document.getElementById("messages");

            // メッセージを描画する関数
            const appendMessage = (message) => {
                const li = document.createElement("li");
                li.textContent = message;
                messagesList.appendChild(li);
            };

            // サーバとの接続確立時にメッセージをロード
            socket.on("connect", () => socket.emit("load messages"));

            // サーバーから全メッセージを受信
            socket.on("load all messages", (messages) => {
                messages.forEach(appendMessage);
            });

            // メッセージ送信処理
            messageButton.addEventListener("click", () => {
                const message = messageInput.value.trim();
                if (message) {
                    socket.emit("send message", message);
                    messageInput.value = "";
                }
            });

            // サーバーから単一メッセージを受信
            socket.on("load one message", appendMessage);
        });
    </script>
</head>
<body>
    <h1>リアルタイムチャット</h1>
    <ul id="messages"></ul>
    <input type="text" id="message-input" placeholder="メッセージを入力">
    <button id="send-message">送信</button>
</body>
</html>
