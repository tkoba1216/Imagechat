<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocha.ru</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"></script>
</head>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const socket = io();
        const fileInput = document.getElementById("file-input");
        const messageInput = document.getElementById("message-input");
        const emojiSelect = document.getElementById("emoji-select");
        const messageButton = document.getElementById("send-message");
        const messagesList = document.getElementById("messages");
        const canvas = document.getElementById("canvas");
    
        const appendMessage = (message) => {
            let li = document.createElement("li");
            li.className = "message-card";
    
            let img = document.createElement("img");
            img.src = "data:image/jpeg;base64," + message.image_data;
            img.className = "message-image";
    
            let text = document.createElement("p");
            text.className = "message-text";
            text.textContent = message.emoji;
    
            let likeButton = document.createElement("button");
            likeButton.className = "like-button btn";
            likeButton.textContent = "👍 いいね (" + message.likes + ")";
            likeButton.onclick = () => socket.emit("like message", { message_id: message.message_id });
            likeButton.setAttribute("data-message-id", message.message_id);
    
            li.appendChild(img);
            li.appendChild(text);
            li.appendChild(likeButton);
            messagesList.appendChild(li);
        };
    
        socket.on("connect", () => socket.emit("load messages"));
    
        socket.on("load all messages", (messages) => {
            messagesList.innerHTML = "";
            messages.forEach(appendMessage);
        });
    
        socket.on("update likes", (data) => {
            let buttons = document.querySelectorAll("button[data-message-id='" + data.message_id + "']");
            buttons.forEach(btn => btn.textContent = "👍 いいね (" + data.likes + ")");
        });
    
        messageButton.addEventListener("click", () => {
            const file = fileInput.files[0];
            if (!file) {
                alert('画像を選択してください');
                return;
            }
    
            const reader = new FileReader();
            const image = new Image();
            const selectedEmoji = emojiSelect.value;
    
            reader.onload = function(event) {
                image.onload = function() {
                    const ctx = canvas.getContext("2d");
                    const max_size = 400;
                    const scale = image.width > image.height ? max_size / image.width : max_size / image.height;
                    
                    canvas.width = image.width * scale;
                    canvas.height = image.height * scale;
                    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    
                    const imageData = canvas.toDataURL("image/jpeg");
                    socket.emit("send message", {
                        message: messageInput.value,
                        emoji: selectedEmoji,
                        image_name: file.name,
                        image_data: imageData
                    });
    
                    messageInput.value = "";
                    fileInput.value = "";
                };
                image.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    
        socket.on("load one message", appendMessage);
    });
    </script>
    
<body>
    <div class="container">
        <h1 class="text-center my-4">Ocha.ru</h1>
        <div class="message-container">
            <ul id="messages" class="message-grid"></ul>
        </div>
        <div class="post-form">
            <div class="input-group mb-3">
                <select id="emoji-select" class="form-select">
                    <option value="☺️">☺️</option>
                    <option value="😭">😭</option>
                    <option value="🥱">🥱</option>
                </select>
                <input type="text" id="message-input" class="form-control" placeholder="思うままに🍵">
            </div>
            <div class="mb-3">
                <input type="file" id="file-input" class="form-control">
            </div>
            <button id="send-message" class="btn btn-primary w-100">送信</button>
        </div>
    </div>
    <canvas id="canvas" style="display: none;"></canvas>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
